<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini 聊天介面</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      background-color: #131314;
      color: #e3e3e3;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* 聊天歷史訊息顯示區 */
    .chat-history {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 右側發送的訊息氣泡 */
    .chat-bubble-user {
      align-self: flex-end;
      max-width: 80%;
      background-color: #282a2c;
      border-radius: 18px 18px 4px 18px;
      padding: 8px;
      position: relative;
    }

    /* 氣泡內的影片卡片 */
    .bubble-video-card {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      background-color: #000;
      cursor: pointer;
      max-width: 200px;
    }

    .bubble-video-card video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .bubble-video-card .duration-tag {
      position: absolute;
      top: 6px;
      left: 6px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 10px;
      backdrop-filter: blur(4px);
    }

    /* 底部輸入欄區域 */
    .input-container {
      padding: 8px 16px 16px;
      background-color: #131314;
    }

    .input-box {
      background-color: #1e1f20;
      border-radius: 28px;
      padding: 8px 12px 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* 待發送媒體預覽卡片 (卡在輸入框內) */
    .preview-area {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-top: 4px;
    }

    .preview-card {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: #000;
    }

    .preview-card video, .preview-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 預覽卡片的關閉按鈕 (X) */
    .preview-card .close-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 18px;
      height: 18px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 預覽卡片時長標籤 */
    .preview-card .duration {
      position: absolute;
      bottom: 4px;
      left: 4px;
      font-size: 9px;
      color: #fff;
      background: rgba(0, 0, 0, 0.6);
      padding: 1px 4px;
      border-radius: 4px;
    }

    /* 輸入列控制按鈕 */
    .input-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: #c4c7c5;
      font-size: 20px;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .text-input {
      flex: 1;
      background: none;
      border: none;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .send-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #2b2d30;
      border: none;
      color: #8e918f;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send-btn.active {
      background-color: #a8c7fa;
      color: #040e15;
    }

    /* 底部彈出的選單 (Action Sheet) */
    .action-sheet {
      position: fixed;
      bottom: -100%;
      left: 0;
      right: 0;
      background-color: #1e1f20;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      transition: bottom 0.3s ease;
      z-index: 100;
    }

    .action-sheet.show {
      bottom: 0;
    }

    .sheet-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      text-align: center;
    }

    .sheet-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #c4c7c5;
      font-size: 12px;
      cursor: pointer;
    }

    .sheet-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #282a2c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    /* 遮罩背景 */
    .overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      z-index: 99;
    }

    .overlay.show {
      display: block;
    }

    /* 原生隱藏 Input */
    #hiddenFileInput {
      display: none;
    }
  </style>
</head>
<body>

  <!-- 對話區域 -->
  <div class="chat-history" id="chatHistory"></div>

  <!-- 輸入區域 -->
  <div class="input-container">
    <div class="input-box">
      <!-- 媒體預覽區（選完媒體後卡在輸入框內） -->
      <div class="preview-area" id="previewArea"></div>
      
      <div class="input-controls">
        <button class="btn-icon" onclick="openMenu()">＋</button>
        <input type="text" class="text-input" id="textInput" placeholder="問問 Gemini" oninput="updateSendButton()">
        <button class="send-btn" id="sendBtn" onclick="sendMedia()">▲</button>
      </div>
    </div>
  </div>

  <!-- 隱藏的原生檔案選擇器 -->
  <input type="file" id="hiddenFileInput" accept="video/*,image/*" multiple onchange="onFilesSelected(event)">

  <!-- 點擊加號彈出的底欄選單與遮罩 -->
  <div class="overlay" id="overlay" onclick="closeMenu()"></div>
  <div class="action-sheet" id="actionSheet">
    <div class="sheet-grid">
      <div class="sheet-item" onclick="triggerGallery()">
        <div class="sheet-icon">🖼️</div>
        <span>相簿</span>
      </div>
      <div class="sheet-item">
        <div class="sheet-icon">📷</div>
        <span>相機</span>
      </div>
      <div class="sheet-item">
        <div class="sheet-icon">📁</div>
        <span>檔案</span>
      </div>
    </div>
  </div>

  <script>
    let selectedFiles = [];

    // 開啟底欄選單
    function openMenu() {
      document.getElementById('actionSheet').classList.add('show');
      document.getElementById('overlay').classList.add('show');
    }

    // 關閉底欄選單
    function closeMenu() {
      document.getElementById('actionSheet').classList.remove('show');
      document.getElementById('overlay').classList.remove('show');
    }

    // 觸發原生系統相簿選擇
    function triggerGallery() {
      closeMenu();
      document.getElementById('hiddenFileInput').click();
    }

    // 當使用者在相簿選好影片或照片時
    function onFilesSelected(e) {
      const files = Array.from(e.target.files);
      
      selectedFiles = [...selectedFiles, ...files];
      renderPreviewCards();
      updateSendButton();
    }

    // 渲染輸入框內部的多媒體縮圖卡片
    function renderPreviewCards() {
      const container = document.getElementById('previewArea');
      container.innerHTML = '';

      selectedFiles.forEach((file, index) => {
        const card = document.createElement('div');
        card.className = 'preview-card';
        const url = URL.createObjectURL(file);

        if (file.type.startsWith('video/')) {
          const video = document.createElement('video');
          video.src = url;
          card.appendChild(video);

          // 自動讀取影片長度
          video.onloadedmetadata = () => {
            const timeTag = document.createElement('span');
            timeTag.className = 'duration';
            timeTag.innerText = formatTime(video.duration);
            card.appendChild(timeTag);
          };
        } else {
          const img = document.createElement('img');
          img.src = url;
          card.appendChild(img);
        }

        // X 按鈕：刪除已選取圖片/影片
        const closeBtn = document.createElement('button');
        closeBtn.className = 'close-btn';
        closeBtn.innerText = '✕';
        closeBtn.onclick = () => {
          selectedFiles.splice(index, 1);
          renderPreviewCards();
          updateSendButton();
        };

        card.appendChild(closeBtn);
        container.appendChild(card);
      });
    }

    // 更新發送按鈕亮起狀態
    function updateSendButton() {
      const text = document.getElementById('textInput').value;
      const sendBtn = document.getElementById('sendBtn');
      if (text.trim().length > 0 || selectedFiles.length > 0) {
        sendBtn.classList.add('active');
      } else {
        sendBtn.classList.remove('active');
      }
    }

    // 發送媒體至歷史聊天框
    function sendMedia() {
      if (selectedFiles.length === 0 && !document.getElementById('textInput').value.trim()) return;

      const history = document.getElementById('chatHistory');

      selectedFiles.forEach(file => {
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble-user';

        if (file.type.startsWith('video/')) {
          const videoCard = document.createElement('div');
          videoCard.className = 'bubble-video-card';

          const video = document.createElement('video');
          video.src = URL.createObjectURL(file);
          video.controls = true;

          video.onloadedmetadata = () => {
            const tag = document.createElement('div');
            tag.className = 'duration-tag';
            tag.innerText = ▶ ${formatTime(video.duration)};
            videoCard.appendChild(tag);
          };

          videoCard.appendChild(video);
          bubble.appendChild(videoCard);
        }

        history.appendChild(bubble);
      });

      // 清除資料
      selectedFiles = [];
      document.getElementById('textInput').value = '';
      document.getElementById('hiddenFileInput').value = '';
      renderPreviewCards();
      updateSendButton();

      // 畫面自動滾動到底部
      history.scrollTop = history.scrollHeight;
    }

    // 格式化秒數為分:秒 (如 0:57)
    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return ${m}:${s < 10 ? '0' : ''}${s};
    }
  </script>
</body>
</html>
